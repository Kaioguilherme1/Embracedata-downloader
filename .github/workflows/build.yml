name: Build Executables

on:
  push:
    tags:
      - 'v*' # Trigger build on version tags like v1.0.0
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter requests

    - name: Build Executable
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "Embracedata Downloader" --add-data "engine.py:." main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Embracedata_Downloader_${{ matrix.os }}
        path: dist/Embracedata Downloader/
