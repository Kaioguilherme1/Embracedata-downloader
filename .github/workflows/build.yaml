name: Build e Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ====================================================
  # Build para Linux (bash)
  # ====================================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências (Linux)
        run: sudo apt-get install -y python3-tk

      - name: Instalar pacotes Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter requests

      - name: Build com PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --name "Embracedata_Downloader-linux" \
            --add-data "engine.py:." \
            --collect-all customtkinter \
            main.py

      - name: Marcar como executável
        run: chmod +x dist/Embracedata_Downloader-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Embracedata_Downloader-linux
          path: dist/Embracedata_Downloader-linux

  # ====================================================
  # Build para macOS (DMG e ZIP com .app)
  # ====================================================
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pacotes Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter requests

      - name: Build com PyInstaller (.app bundle)
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "Embracedata Downloader" \
            --icon "icons/icon.icns" \
            --osx-bundle-identifier "br.inpe.embracedata.downloader" \
            --add-data "engine.py:." \
            --collect-all customtkinter \
            main.py

      - name: Assinatura Ad-hoc do App Bundle
        run: |
          codesign --force --deep --sign - "dist/Embracedata Downloader.app"

      - name: Empacotar DMG e ZIP para Distribuição
        run: |
          # 1. Empacotar ZIP preservando permissões e links simbólicos
          ditto -c -k --keepParent "dist/Embracedata Downloader.app" "dist/Embracedata_Downloader-macos.zip"

          # 2. Criar DMG instalável com atalho para /Applications
          mkdir -p dist/dmg_staging
          cp -R "dist/Embracedata Downloader.app" dist/dmg_staging/
          ln -s /Applications dist/dmg_staging/Applications
          hdiutil create -volname "Embracedata Downloader" \
            -srcfolder dist/dmg_staging \
            -ov -format UDZO "dist/Embracedata_Downloader-macos.dmg"

      - name: Upload artifact DMG
        uses: actions/upload-artifact@v4
        with:
          name: Embracedata_Downloader-macos-dmg
          path: dist/Embracedata_Downloader-macos.dmg

      - name: Upload artifact ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Embracedata_Downloader-macos-zip
          path: dist/Embracedata_Downloader-macos.zip

  # ====================================================
  # Build para Windows (PowerShell)
  # ====================================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pacotes Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter requests

      - name: Build com PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "Embracedata_Downloader-windows" `
            --add-data "engine.py;." `
            --collect-all customtkinter `
            --icon "icons/icon.ico" `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Embracedata_Downloader-windows
          path: dist/Embracedata_Downloader-windows.exe

  # ====================================================
  # Publicar Release no GitHub com os 3 sistemas
  # ====================================================
  release:
    name: Criar Release GitHub
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extrair versão do pyproject.toml
        run: |
          VERSION=$(python -c "
          import re
          content = open('pyproject.toml').read()
          m = re.search(r'version = \"(.+?)\"', content)
          print(m.group(1))
          ")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download todos os artefatos
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Listar artefatos (debug)
        run: find artifacts/ -type f

      - name: Criar GitHub Release com binários
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release v${{ env.VERSION }}"
          body: |
            ## Embracedata Downloader v${{ env.VERSION }}

            ### Novidades desta versão
            - Motor de download inteligente (Web Scraping do índice do INPE — zero erros 404)
            - Multithreading adaptativo baseado nos núcleos do processador
            - Interface redesenhada para pesquisadores e leigos
            - Data Final se auto-ajusta ao mudar a Data Inicial

            ### Como usar
            1. Baixe o arquivo correspondente ao seu sistema operacional abaixo:
            2. **macOS**: Baixe o arquivo `.dmg` (ou `.zip`). Abra o `.dmg` e arraste para Aplicativos (ou clique duas vezes no app para abrir).
               *Aviso no macOS (Gatekeeper)*: Como o binário é open source e não possui certificado pago da Apple, na primeira execução clique com o **botão direito (ou Control + Clique)** sobre o app e escolha **Abrir** (ou acesse *Ajustes do Sistema → Privacidade e Segurança → Abrir Mesmo Assim*).
            3. **Windows**: Baixe o executável `.exe` e clique duas vezes para abrir.
            4. **Linux**: Baixe o binário e execute via terminal:
               ```bash
               chmod +x Embracedata_Downloader-linux && ./Embracedata_Downloader-linux
               ```
          draft: false
          prerelease: false
          files: |
            artifacts/Embracedata_Downloader-linux/Embracedata_Downloader-linux
            artifacts/Embracedata_Downloader-macos-dmg/Embracedata_Downloader-macos.dmg
            artifacts/Embracedata_Downloader-macos-zip/Embracedata_Downloader-macos.zip
            artifacts/Embracedata_Downloader-windows/Embracedata_Downloader-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}